models:
  lstm_ae:
    hidden: 64
    layers: 2
    bottleneck: 16
    lr: 0.001
    batch_size: 512
    max_epochs: 10
    patience: 2
    max_train_sequences: 60000    # random sample of training-window sequences per fold (CPU budget, D-017)
    val_frac: 0.1                 # last 10% of the training window (by time) for early stopping
    loss: mse                     # mse | huber
    score_last_k: 5               # score = reconstruction MSE over the last k days of the window
    num_threads: 8
  iforest:
    n_estimators: 300
    max_samples: 4096
    max_train_rows: 200000
  lightgbm:
    objective: regression
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    target: fwd_excess_5d
