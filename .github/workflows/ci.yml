name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
      - name: Tests (fixture data only - CI never downloads from NSE)
        run: |
          pytest --cov=smd --cov-report=term-missing \
                 --cov-fail-under=85
      - name: Coverage on core packages (>= 85%)
        run: |
          coverage report --include="*/smd/clean/*,*/smd/features/*,*/smd/universe/*,*/smd/backtest/*,*/smd/cv/*" --fail-under=85
